<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Vargas & Asociados</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:auto;color:#202939}nav{background:#172c4b;padding:14px}nav a{color:white;margin-right:18px;text-decoration:none}main{padding:20px 0}table{border-collapse:collapse;width:100%}th,td{padding:10px;border:1px solid #d9d9d9;text-align:left}th{background:#172c4b;color:white}.msg{padding:10px;background:#eaf5ea;margin:10px 0}.error{background:#fdecec}input,select,textarea{padding:7px;margin:4px;width:95%}button,.btn{background:#172c4b;color:white;padding:8px 12px;border:0;text-decoration:none;cursor:pointer}footer{margin-top:35px;border-top:1px solid #ddd;padding:15px 0;color:#667}</style></head><body><nav><a href="{% url 'clientes_lista' %}">Clientes</a><a href="{% url 'lista_casos' %}">Casos</a></nav><main>{% for message in messages %}<div class="msg {% if message.tags == 'error' %}error{% endif %}">{{ message }}</div>{% endfor %}{% block contenido %}{% endblock %}</main><footer>Vargas & Asociados - Portal de gestión de casos</footer></body></html>
